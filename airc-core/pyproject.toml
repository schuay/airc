[project]
name = "airc-core"
version = "0.1.0"
description = "Shared substrate for the airc daemon suite: agent runner, model, artifacts, MCP toolset, token ledger"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "langchain[google-genai]>=1.2.10",
    "langgraph>=1.0.10",
    "langchain-mcp-adapters>=0.2.1",
    # Cap mcp below 2.0: langchain-mcp-adapters declares an unbounded `mcp>=1.24`
    # but still imports mcp.shared.context.RequestContext, which 2.0 replaced with
    # BaseContext. A fresh resolve therefore floats to 2.0 and every airc process
    # dies at import with "cannot import name 'RequestContext'". Drop the cap only
    # once the adapters release notes say 2.0 is supported -- their version floor
    # is not a ceiling.
    "mcp<2",
    "langchain-google-vertexai>=3.0.0",
    "langchain-deepseek>=1.0.1",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "platformdirs>=4.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airc_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
