[project]
name = "airc-tools"
version = "0.1.0"
description = "Stateless shell + verbatim read + SEARCH/REPLACE edit for airc coding agents"
requires-python = ">=3.12"
license = "MIT"
# A leaf library (no airc dependency): shell/read/edit primitives that deepagent
# binds into per-job worktree tools and airc-room's memory tools reuse. No MCP
# server -- the room and harness call these functions directly.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airc_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
