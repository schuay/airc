[project]
name = "bus"
version = "0.1.0"
description = "Directory-backed message bus: domain-neutral transport primitives (envelope, topics, channel, blobs)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
